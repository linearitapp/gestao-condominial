<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão Condominial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app">
  <header class="topbar" id="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="8" height="8" rx="1.5" fill="var(--accent)"/>
        <rect x="13" y="3" width="8" height="8" rx="1.5" fill="var(--accent)" opacity=".45"/>
        <rect x="3" y="13" width="8" height="8" rx="1.5" fill="var(--accent)" opacity=".45"/>
        <rect x="13" y="13" width="8" height="8" rx="1.5" fill="var(--accent)" opacity=".2"/>
      </svg>
      <div class="brand-text">
        <strong>Gestão <span>Condominial</span></strong>
        <small id="brand-sub">Obras e moradores num só lugar</small>
      </div>
    </div>
    <div class="topbar-right">
      <span id="sync-pill" class="pill pill-muted" title="Modo de armazenamento">…</span>
      <button id="btn-informar-obra" class="btn btn-accent" hidden>Informar obra</button>
    </div>
  </header>

  <div id="admin-shell" class="admin-shell" hidden>
    <nav class="rail" id="rail" aria-label="Etapas do cadastro"></nav>
    <main class="content" id="admin-content"></main>
  </div>

  <main id="obra-shell" class="obra-shell" hidden></main>

  <main id="doc-shell" class="doc-shell" hidden></main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script src="core.js"></script>
<script src="views.js"></script>
<script src="obra.js"></script>
</body>
</html>
